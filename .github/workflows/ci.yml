name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest

      - name: build.py（validate が門番）
        run: python build.py

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: python -m compileall
        run: python -m compileall -q .

      - name: yamllint（.github 配下の workflow・Issue テンプレート）
        run: yamllint .github/workflows .github/ISSUE_TEMPLATE

      - name: entries.tsv / aliases.tsv の検証のみ単体実行
        run: python -m lib.validate data/entries.tsv data/aliases.tsv
